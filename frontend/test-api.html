<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>API Connection Test</h1>
    <button onclick="testAPI()">Test API Connection</button>
    <div id="result"></div>
    
    <script>
        async function testAPI() {
            const result = document.getElementById('result');
            result.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('http://192.168.0.15:5002/api/health');
                const data = await response.json();
                result.innerHTML = `
                    <h3>✅ Connected!</h3>
                    <p>Status: ${data.status}</p>
                    <p>Timestamp: ${data.timestamp}</p>
                `;
            } catch (error) {
                result.innerHTML = `
                    <h3>❌ Connection Failed</h3>
                    <p>Error: ${error.message}</p>
                    <p>Make sure:</p>
                    <ul>
                        <li>Backend is running on 192.168.0.15:5002</li>
                        <li>Both devices are on same WiFi network</li>
                        <li>No firewall blocking port 5002</li>
                    </ul>
                `;
            }
        }
    </script>
</body>
</html>
