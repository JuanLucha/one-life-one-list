services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: one-life-one-list-backend
    ports:
      - "5005:5005"
    volumes:
      - backend_data:/app/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - FLASK_ENV=production
      - FLASK_APP=app.py
      - AUTH_TOKEN=${AUTH_TOKEN:-}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: one-life-one-list-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Reverse proxy opcional para producción
  nginx:
    image: nginx:alpine
    container_name: one-life-one-list-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  backend_data:
    driver: local
